<!-- When you type a URL into a web browser and press Enter, the browser first checks the URL and uses 
DNS (Domain Name System) to find the website’s IP address. It then establishes a connection with the
 web server using TCP and, for HTTPS websites, secures the connection using TLS. The browser sends an 
 HTTP request to the server, which processes the request and returns a response containing HTML, CSS
 , JavaScript, images, and other resources. The browser then parses the HTML to create the DOM
  (Document Object Model), applies CSS to style the page, and executes JavaScript to add 
  interactivity. Finally, the browser renders the content on the screen, allowing you to see and
   interact with the webpage. -->
